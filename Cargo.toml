[package]
name = "notifiapp-protocol-core"
version = "0.1.0"
edition = "2024"
description = "Core protocol abstractions for notifiapp: generic envelopes, clients, servers, and subscriptions"

[dependencies]
notifiapp-transport = { path = "../notifiapp-transport" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
dashmap = "6"
tracing = "0.1"

[features]
default = ["webrtc"]
# Enable WebRTC signaling and room models
webrtc = []

