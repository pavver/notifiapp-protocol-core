[package]
name = "notifiapp-protocol-core"
version = "0.1.0"
edition = "2024"
description = "Core protocol abstractions for notifiapp: generic envelopes, clients, servers, and subscriptions"

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
thiserror = "2.0.19"
async-trait = "0.1.91"
futures-util = "0.3.33"
tracing = "0.1.44"
notifiapp-protocol-macros = { path = "macros" }

notifiapp-transport = { path = "../notifiapp-transport", default-features = false, features = ["ws"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
tokio-util = { version = "0.7.19" }
dashmap = "6.2.1"
url = "2.5.8"
parking_lot = "0.12.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.24.0", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["rt"] }

[features]
build-utils = []
default = []

