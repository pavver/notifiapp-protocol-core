[package]
name = "notifiapp-protocol-core"
version = "0.1.0"
edition = "2024"
description = "Core protocol abstractions for notifiapp: generic envelopes, clients, servers, and subscriptions"

[dependencies]
notifiapp-transport = { path = "../notifiapp-transport" }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "time"] }
tokio-util = { version = "0.7.19" }
thiserror = "2.0.19"
async-trait = "0.1.91"
futures-util = "0.3.33"
dashmap = "6.2.1"
tracing = "0.1.44"
url = "2.5.8"
parking_lot = "0.12.5"
notifiapp-protocol-macros = { path = "macros" }

[features]
build-utils = []
default = []

